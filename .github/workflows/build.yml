name: Build APK

# One job: the two glibc preload libraries the session needs, then the app around them.
# Nothing is built on a developer machine — this workflow is the only thing that produces an apk.
#
# This repo is private, so every minute here is billed. Three caches carry the cost of a rebuild
# down to what actually changed:
#   • Gradle's own (dependencies, wrapper, build cache, configuration cache) via setup-gradle
#   • the CMake/ninja tree, so a Kotlin-only change does not recompile the compositor
#   • the two cross-compiled preloads, which also skips installing the cross toolchain
# A run that changes only Kotlin should not touch the C compiler at all.

on:
  push:
    branches: [ main ]
    # Documentation changes cannot alter the apk, so they do not buy a build.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes the running build pointless; stop paying for it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bump to force the preload cache to miss (e.g. after changing a compiler flag below).
  PRELOAD_CACHE_VERSION: v1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches ~/.gradle (dependencies, wrapper distribution, build cache, configuration cache)
      # and prunes what the run did not use, so the entry cannot grow without bound.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Resolve the runner's NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          VERSION=$(sed -n 's/^Pkg.Revision *= *//p' "$NDK/source.properties")
          echo "NDK $VERSION at $NDK"
          echo "NDK_VERSION=$VERSION" >> "$GITHUB_ENV"

      # ── The session's preloads ───────────────────────────────────────────────────────────
      # Both are glibc aarch64 libraries that live inside the rootfs, so they are cross-compiled
      # here rather than by the NDK. They ship in assets (not in the runtime tarball) so a fix in
      # either reaches an already-installed runtime on the next launch instead of waiting on a
      # ~790 MB runtime re-host. Their inputs change rarely, so most runs restore them.
      - name: Cache the preloads
        id: preloads
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/linuxfs
          key: preloads-${{ env.PRELOAD_CACHE_VERSION }}-${{ hashFiles('app/src/main/cpp/fakeinput_steam.cpp', 'tools/linuxfs/preload/*.c', 'tools/linuxfs/overlay/usr/local/bin/*', 'tools/linuxfs/desktop/*') }}

      - name: Build libfakeinput.so and libblsession.so (glibc aarch64)
        if: steps.preloads.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu >/dev/null
          D=app/src/main/assets/linuxfs
          mkdir -p "$D"
          # Statically linked C++ runtime: this is preloaded into every Steam process, and Steam
          # ships its own libstdc++ while rewriting LD_LIBRARY_PATH. Pulling the system one in
          # ahead of it is a version conflict waiting to happen. Only libc is left as a dependency.
          aarch64-linux-gnu-g++ -shared -fPIC -O2 -Wall -Wno-attributes -Wno-nonnull-compare \
            -pthread -std=c++17 -static-libstdc++ -static-libgcc \
            -o "$D/libfakeinput.so" app/src/main/cpp/fakeinput_steam.cpp -ldl
          aarch64-linux-gnu-strip --strip-unneeded "$D/libfakeinput.so"
          aarch64-linux-gnu-gcc -shared -fPIC -O2 -Wall -pthread \
            -o "$D/libblsession.so" tools/linuxfs/preload/*.c -ldl
          aarch64-linux-gnu-strip --strip-unneeded "$D/libblsession.so"
          # The session's scripts travel the same way, for the same reason.
          for script in tools/linuxfs/overlay/usr/local/bin/bannerlator-*; do
            install -Dm644 "$script" "$D/usr/local/bin/$(basename "$script")"
          done
          # And the desktop's launcher and labwc defaults, staged over the desktop package's copies.
          install -Dm644 tools/linuxfs/desktop/steamdeck-desktop "$D/usr/local/bin/steamdeck-desktop"
          install -Dm644 tools/linuxfs/desktop/autostart "$D/etc/xdg/labwc/autostart"
          install -Dm644 tools/linuxfs/desktop/rc.xml "$D/etc/xdg/labwc/rc.xml"
          ls -lR "$D"

      # Runs whether the preloads were built or restored: readelf reads any ELF whatever the host,
      # so these assertions cost nothing and need no cross toolchain.
      - name: Check the preloads
        run: |
          set -euo pipefail
          D=app/src/main/assets/linuxfs
          NEED=$(readelf -d "$D/libfakeinput.so" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p')
          echo "libfakeinput NEEDED: $NEED"
          for bad in libstdc++.so.6 libgcc_s.so.1; do
            if printf '%s\n' "$NEED" | grep -qx "$bad"; then
              echo "::error::libfakeinput.so links $bad — the C++ runtime must stay static"; exit 1
            fi
          done
          syms() { readelf -Ws "$1" | awk '$4 == "FUNC" && $5 == "GLOBAL" {sub(/@.*/, "", $8); print $8}'; }
          # The interposers are the whole point: if one is missing the client sees no controller.
          FAKE=$(syms "$D/libfakeinput.so")
          for sym in open openat ioctl read close poll ppoll select stat fstat access scandir; do
            grep -qx "$sym" <<<"$FAKE" || { echo "::error::libfakeinput.so does not export $sym"; exit 1; }
          done
          SESSION=$(syms "$D/libblsession.so")
          for sym in socket bind getsockname setsockopt statfs statvfs; do
            grep -qx "$sym" <<<"$SESSION" || { echo "::error::libblsession.so does not export $sym"; exit 1; }
          done
          test -f "$D/usr/local/bin/bannerlator-session"
          test -f "$D/usr/local/bin/bannerlator-proton-extra"
          echo "preloads check out"

      # ── The native build ─────────────────────────────────────────────────────────────────
      # The compositor and adrenotools are the slowest part of a build and change least often.
      # The key pins the C sources and the NDK; the restore-key still hands an older tree to
      # ninja, which then rebuilds only the files that differ.
      - name: Cache the CMake build tree
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx
            app/build/intermediates/cxx
          key: cxx-${{ env.NDK_VERSION }}-${{ hashFiles('app/src/main/cpp/**') }}
          restore-keys: |
            cxx-${{ env.NDK_VERSION }}-

      # Release, not debug: AGP quietly drops v1 (JAR) signing from a debug build once minSdk is
      # 24 or higher, and the apk has to carry all three schemes. Nothing is minified either way.
      - name: Build
        run: ./gradlew assembleRelease -PndkVersion="$NDK_VERSION"

      - name: Describe the apk
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "apk: $APK"
          ls -l "$APK"
          sha256sum "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a|assets/linuxfs' | head -30

      # Every NEEDED of every library we ship must resolve inside the apk or on the device. The
      # first build shipped libwayland-server.so without libffi.so, and the app died on
      # System.loadLibrary the moment a session started — a check this step would have caught.
      - name: Check the native dependency closure
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          WORK=$(mktemp -d)
          unzip -q "$APK" 'lib/arm64-v8a/*' -d "$WORK"
          cd "$WORK/lib/arm64-v8a"
          # Provided by the platform, so never packaged.
          SYSTEM="libc.so libm.so libdl.so liblog.so libandroid.so libz.so libvulkan.so
                  libGLESv2.so libEGL.so libnativewindow.so libjnigraphics.so libaaudio.so
                  libOpenSLES.so libmediandk.so libcamera2ndk.so libsync.so libneuralnetworks.so"
          fail=0
          for so in *.so; do
            for need in $(readelf -d "$so" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p'); do
              [ -f "$need" ] && continue
              case " $SYSTEM " in *" $need "*) continue ;; esac
              echo "::error::$so needs $need, which is neither in the apk nor a platform library"
              fail=1
            done
          done
          [ "$fail" = 0 ] && echo "every NEEDED resolves"
          exit $fail

      # AGP signs with v2+v3 and drops v1 whenever minSdk is 24 or higher, and setting
      # enableV1Signing in the DSL does not move it. Re-signing here with apksigner is the one way
      # to be sure of what the apk carries: zipalign first, then all three schemes explicitly.
      - name: Sign with the testkey (v1 + v2 + v3)
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -1)
          "$TOOLS/zipalign" -p -f 4 "$APK" "$APK.aligned"
          "$TOOLS/apksigner" sign \
            --ks keystore/testkey.p12 --ks-type PKCS12 --ks-pass pass:android \
            --ks-key-alias testkey --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$APK" "$APK.aligned"
          rm -f "$APK.aligned" "$APK.idsig"

      # The apk must stay installable over the last one, and on every Android version: that means
      # one stable key and all three signature schemes. Cheap to assert, easy to lose silently.
      - name: Check the signature
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          # --min-sdk-version 21: apksigner only verifies the schemes an apk's own minSdk requires,
          # so at minSdk 26 it reports v1 as false whether or not the JAR signature is there.
          # Asking it to verify from 21 makes it actually look.
          "$APKSIGNER" verify --min-sdk-version 21 --verbose --print-certs "$APK" | tee /tmp/sig.txt
          # And the files themselves, which is what an old installer reads.
          unzip -l "$APK" | grep -qE 'META-INF/.*\.(SF|RSA|DSA)$' \
            || { echo "::error::apk carries no JAR signature files"; exit 1; }
          for scheme in "v1 scheme (JAR signing): true" "v2 scheme (APK Signature Scheme v2): true" \
                        "v3 scheme (APK Signature Scheme v3): true"; do
            grep -qF "$scheme" /tmp/sig.txt || { echo "::error::apk is not signed with $scheme"; exit 1; }
          done
          grep -qi "CN=Android, OU=Android, O=Android" /tmp/sig.txt \
            || { echo "::error::apk is not signed with the AOSP testkey"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: steamdeck-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
          # An apk is a zip already; compressing it again buys nothing and costs seconds.
          compression-level: 0
